{#- Admin stylesheet, inlined by base.html on admin screens only (T10), so the
    admin needs no static route. Kept separate from the public style.css
    (app/publish.py) on purpose: the admin is a tool, the site is the brand. #}
  <style id="admin-css">
    :root { --ink: #1f2328; --muted: #59636e; --line: #d1d9e0; --bg: #fff;
            --soft: #f6f8fa; --accent: #0b5cad; --danger: #b42318; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e6edf3; --muted: #9198a1; --line: #3d444d; --bg: #0d1117;
              --soft: #151b23; --accent: #6cb6ff; --danger: #ff7b72; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: center;
             padding: .75rem 1rem; border-bottom: 1px solid var(--line); background: var(--soft); }
    header .brand { font-weight: 700; color: var(--ink); text-decoration: none; }
    main { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    footer { max-width: 960px; margin: 0 auto; padding: 1rem; color: var(--muted);
             border-top: 1px solid var(--line); }
    h1 { font-size: 1.6rem; margin: .25rem 0 1rem; }
    h2 { font-size: 1.15rem; margin: 1.5rem 0 .5rem; }
    a { color: var(--accent); }
    table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse;
            margin: 1rem 0; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line);
             vertical-align: middle; }
    thead th { background: var(--soft); font-size: .85rem; text-transform: uppercase;
               letter-spacing: .03em; color: var(--muted); }
    input, select, textarea, button { font: inherit; font-weight: 400; color: inherit; }
    input:not([type=hidden]), select, textarea {
      width: 100%; max-width: 40rem; padding: .45rem .6rem; border: 1px solid var(--line);
      border-radius: 6px; background: var(--bg); }
    td select, form[method=get] select { width: auto; }
    textarea { min-height: 12rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: .9rem; }
    label { font-weight: 600; }
    form[method=get] { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; }
    button { padding: .4rem .9rem; border: 1px solid var(--accent); border-radius: 6px;
             background: var(--accent); color: var(--bg); cursor: pointer; }
    td button, li button { padding: .25rem .6rem; font-size: .9rem; background: transparent;
                           color: var(--accent); }
    td form { margin: .15rem 0; }
    main li { margin: .4rem 0; }
    /* List tables become one card per row on phones instead of scrolling sideways. */
    @media (max-width: 600px) {
      table.stack thead { display: none; }
      table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; }
      table.stack tr { border: 1px solid var(--line); border-radius: 8px; margin: .75rem 0;
                       padding: .5rem 0; }
      table.stack td { border: 0; padding: .2rem .75rem; }
      table.stack td:first-child { font-weight: 600; }
    }
    [role=alert], .error { padding: .6rem .8rem; border-left: 4px solid var(--danger);
                           background: var(--soft); color: var(--danger); }
    section[aria-label=Preview] { margin: 1rem 0; padding: .25rem 1rem 1rem;
                                  border: 1px dashed var(--line); border-radius: 8px;
                                  background: var(--soft); overflow-wrap: anywhere; }
    main ul { padding-left: 1.25rem; }
  </style>
