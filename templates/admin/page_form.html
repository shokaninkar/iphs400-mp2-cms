{% extends "base.html" %}
{% block title %}{{ "Edit Page" if page else "New Page" }} — Admin{% endblock %}
{% block content %}
  <h1>{{ "Edit Page" if page else "New Page" }}</h1>
  {% set values = form or page %}
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ rel(('/admin/pages/' ~ page['id']) if page else '/admin/pages') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label>Title<br>
      <input name="title" value="{{ values['title'] if values else '' }}" required>
    </label></p>
    <p><label>Slug<br>
      <input name="slug" value="{{ values['slug'] if values else '' }}" required>
    </label></p>
    <p><label>Nav order<br>
      <input name="nav_order" type="number" value="{{ values['nav_order'] if values else 0 }}">
    </label></p>
    <p><label>Body (Markdown)<br>
      <textarea id="body_md" name="body_md" rows="10" cols="60">{{ values['body_md'] if values else '' }}</textarea>
    </label></p>
    {% include "admin/_preview.html" %}
    <button type="submit">Save</button>
  </form>
{% endblock %}
