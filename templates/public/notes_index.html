{% extends "base.html" %}
{% block content %}
  <h1>Notes</h1>
  {% if notes %}
    <ul class="notes">
      {%- for note in notes %}
      <li><a href="{{ note['slug'] }}.html">{{ note['title'] }}</a>
        <small>{{ note['created_at'][:10] }}</small></li>
      {%- endfor %}
    </ul>
  {% else %}
    <p>No Notes published yet.</p>
  {% endif %}
{% endblock %}
